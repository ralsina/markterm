name: Release

# Builds the release binaries for every supported OS/architecture and
# attaches them to the GitHub release of the pushed tag. The release
# itself (notes) is created by do_release.sh before CI finishes; the
# release job uploads into it, or creates one for manually pushed tags.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build static Linux binaries (amd64 + arm64)
        run: ./build_static.sh
      # The arm64 binaries execute under the qemu binfmt registered by
      # the build; rendering once proves the cross-compiled result.
      - name: Smoke test the static binaries
        run: |
          ./bin/markterm-static-linux-amd64 table.md --no-pager > /dev/null
          ./bin/markpdf-static-linux-amd64 table.md -o /tmp/amd64.pdf
          test -s /tmp/amd64.pdf
          ./bin/markterm-static-linux-arm64 table.md --no-pager > /dev/null
          ./bin/markpdf-static-linux-arm64 table.md -o /tmp/arm64.pdf
          test -s /tmp/arm64.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: linux-static
          path: bin/*-static-linux-*
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest
      # libharu's PNG support needs libpng, but a Homebrew dylib would
      # become a runtime dependency of the released binary, and plain
      # macOS has none. Build a static libpng into a private prefix and
      # point the C and CMake builds at it; zlib comes from the macOS
      # SDK (every Mac ships libz).
      - name: Build a static libpng
        run: |
          set -e
          deps="$HOME/ci-deps"
          mkdir -p "$deps/lib"
          curl -fsSL -o /tmp/libpng.tar.xz \
            https://github.com/pnggroup/libpng/archive/refs/tags/v1.6.44.tar.gz
          tar -C /tmp -xf /tmp/libpng.tar.xz
          cmake -S /tmp/libpng-1.6.44 -B /tmp/libpng-build \
            -DCMAKE_INSTALL_PREFIX="$deps" \
            -DBUILD_SHARED_LIBS=OFF \
            -DPNG_SHARED=OFF -DPNG_STATIC=ON \
            -DPNG_TESTS=OFF -DPNG_TOOLS=OFF
          cmake --build /tmp/libpng-build
          cmake --install /tmp/libpng-build
      - name: Build binaries
        run: |
          set -e
          deps="$HOME/ci-deps"
          export LIBRARY_PATH="$deps/lib"
          export CPATH="$deps/include${CPATH:+:$CPATH}"
          export CMAKE_PREFIX_PATH="$deps"
          make -C ext
          shards install --without-development
          shards build --without-development --release markterm markmark markpdf
      # The binaries must not depend on Homebrew dylibs end users don't
      # have. OpenSSL (dragged in by Crystal's HTTP client for remote
      # images) is the accepted exception: the next step rewrites those
      # references and ships the dylibs along.
      - name: Check for unexpected Homebrew dependencies
        run: |
          if otool -L bin/markpdf bin/markterm bin/markmark | grep -E 'homebrew|/usr/local/' | grep -v openssl; then
            echo "binary depends on an unexpected Homebrew dylib" >&2
            exit 1
          fi
      - name: Bundle OpenSSL dylibs
        run: |
          set -e
          mkdir dist
          for binary in markterm markmark markpdf; do
            for dep in $(otool -L "bin/$binary" | awk '/homebrew|\/usr\/local\// {print $1}'); do
              dylib="$(basename "$dep")"
              install_name_tool -change "$dep" "@executable_path/$dylib" "bin/$binary"
              [ -f "dist/$dylib" ] || cp "$dep" "dist/$dylib"
            done
            cp "bin/$binary" dist/
            # modifying a Mach-O binary invalidates its (ad-hoc)
            # signature, and arm64 refuses to run unsigned code
            codesign --force --sign - "dist/$binary"
          done
      - name: Smoke test (from dist, like end users run it)
        run: |
          set -e
          cd dist
          ./markterm ../table.md --no-pager > /dev/null
          ./markmark ../table.md > /dev/null
          ./markpdf ../table.md -o /tmp/smoke.pdf
          test -s /tmp/smoke.pdf
      - name: Pack
        run: |
          tar -czf "markterm-macos-${{ matrix.arch }}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: markterm-macos-*.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # The GNU (mingw-w64) toolchain keeps the project's GNU-style
      # @[Link] flags and the ext/ Makefile working unchanged; the
      # UCRT64 environment is MSYS2's current default runtime.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: git make zip
          pacboy: >-
            crystal:p
            shards:p
            gcc:p
            cmake:p
            ninja:p
            libpng:p
            zlib:p
      - name: Build binaries
        shell: msys2 {0}
        run: |
          set -e
          # ext/build-libharu.sh clones libharu and patches it; CRLF
          # line endings from a Windows git checkout make `git apply`
          # fail on every hunk.
          git config --global core.autocrlf false
          git config --global core.eol lf
          make -C ext
          shards install --without-development
          shards build --without-development --release markterm markmark markpdf
      # The exes link some UCRT64 DLLs dynamically (libpng, zlib, ...);
      # ship the ones they actually need next to the exes.
      - name: Bundle runtime DLLs
        shell: msys2 {0}
        run: |
          set -e
          mkdir bundle
          cp bin/*.exe bundle/
          for exe in bundle/*.exe; do
            for dll in $(objdump -p "$exe" | grep -oP '(?<=DLL Name: )\S+'); do
              if [ -f "/ucrt64/bin/$dll" ] && [ ! -f "bundle/$dll" ]; then
                cp "/ucrt64/bin/$dll" bundle/
              fi
            done
          done
          ls bundle
      - name: Smoke test (from the bundle, like end users run it)
        shell: msys2 {0}
        run: |
          set -e
          cd bundle
          ./markterm.exe ../table.md --no-pager > /dev/null
          ./markmark.exe ../table.md > /dev/null
          ./markpdf.exe ../table.md -o smoke.pdf
          test -s smoke.pdf
      - name: Pack
        shell: msys2 {0}
        run: |
          cd bundle
          zip -qr ../markterm-windows-x86_64.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: markterm-windows-x86_64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-static, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --title "Release $TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
          ls -l dist

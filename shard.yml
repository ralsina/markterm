name: markterm
version: 0.9.0

authors:
  - Roberto Alsina <roberto.alsina@gmail.com>

crystal: '>= 1.13.0'

targets:
  markterm:
    main: src/main.cr
  markmark:
    main: src/main_mark.cr
  markpdf:
    main: src/main_pdf.cr

dependencies:
  # Pinned to a commit, not branch: master, so builds are
  # reproducible. This is the footnotes branch of our fork, which
  # also carries the GFM features (tables, alerts, strikethrough,
  # task lists) that icyleaf/master has
  markd:
    github: ralsina/markd
    commit: 333befc4717fabcc6e5b61fe4d698254e46cc7e5
  # Kept in-tree (path dependency) so it can be extracted into its
  # own repository later without changing the require.
  hyphen:
    path: ./hyphen
  docopt:
    github: ralsina/docopt.cr
  tartrazine:
    github: ralsina/tartrazine
  sixteen:
    github: ralsina/sixteen
  tablo:
    github: hutou/tablo
  term-screen:
    github: crystal-term/screen
  crimage:
    github: naqvis/crimage

development_dependencies:
  ameba:
    github: crystal-ameba/ameba

license: MIT

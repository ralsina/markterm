name: markterm
version: 0.12.0

authors:
  - Roberto Alsina <roberto.alsina@gmail.com>

crystal: '>= 1.13.0'

targets:
  markterm:
    main: src/main.cr
  markmark:
    main: src/main_mark.cr
  markpdf:
    main: src/main_pdf.cr
  markpdf-web:
    main: src/main_web.cr

dependencies:
  # Pinned to a tag of our fork, so builds are reproducible and what
  # the pin contains is a lookup, not a raw commit. footnotes-v2 is
  # the footnotes branch as reviewed on icyleaf/markd#78, which also
  # carries the GFM features (tables, alerts, strikethrough, task
  # lists) that icyleaf/master has. footnotes-v3 adds the byte-offset
  # fix for footnote reference labels after multibyte characters.
  markd:
    github: ralsina/markd
    tag: footnotes-v3
  # Kept in-tree (path dependency) so it can be extracted into its
  # own repository later without changing the require.
  hyphen:
    path: ./hyphen
  docopt:
    github: ralsina/docopt.cr
  # docopt with config file and environment variable support, so the
  # CLI tools honor ~/.config/<tool>/config.yml and $TOOL_* env vars
  docopt-config:
    github: ralsina/docopt-config
    version: ~> 0.3.0
  tartrazine:
    github: ralsina/tartrazine
  sixteen:
    github: ralsina/sixteen
  tablo:
    github: hutou/tablo
  term-color:
    github: crystal-term/color
  term-screen:
    github: crystal-term/screen
  crimage:
    github: naqvis/crimage
  # The markpdf-web playground: a small Kemal site where visitors edit
  # markdown, tweak styling knobs, and see the markpdf output live.
  kemal:
    github: kemalcr/kemal

development_dependencies:
  ameba:
    github: crystal-ameba/ameba

license: MIT
